quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOSTNAME}/${POSTGRES_DB}

quarkus.hibernate-orm.schema-management.strategy=update

quarkus.smallrye-openapi.info-title=Game Library API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Verwaltung einer persönlichen Spielesammlung (Modul 223)

quarkus.http.cors.enabled=true

# Testdaten nur im Entwicklungsprofil
library.example-data.enabled=false
%dev.library.example-data.enabled=true
